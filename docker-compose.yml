version: '3.8'

services:
  server:
    build: ./server
    container_name: purplemerit-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=purplemerit
      - DB_USER=purplemerit
      - DB_PASSWORD=purplemerit
      - DB_SSL=false
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - CLIENT_URL=http://localhost
      - NODE_ENV=production
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@purplemerit.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
      - SEED_SAMPLE_PASSWORD=${SEED_SAMPLE_PASSWORD:-}
    depends_on:
      - mysql

  client:
    build: ./client
    container_name: purplemerit-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  mysql:
    image: mysql:8.4
    container_name: purplemerit-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=purplemerit
      - MYSQL_USER=purplemerit
      - MYSQL_PASSWORD=purplemerit
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
